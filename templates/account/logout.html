{% extends "base.html" %}
{% load i18n %}
{% block title %}Uitloggen · Maintainers{% endblock %}
{% block content %}
<section class="mx-auto max-w-md px-6 py-20">
  <div class="rounded-2xl border border-slate-800 bg-slate-900 p-8 text-center shadow-2xl shadow-black/20">
    <p class="text-sm font-semibold uppercase tracking-widest text-mint">Tot de volgende keer</p>
    <h1 class="mt-3 text-3xl font-black">Uitloggen?</h1>
    <p class="mt-3 text-slate-400">Je lokale sessie wordt beëindigd.</p>
    <form method="post" class="mt-8">{% csrf_token %}<button class="w-full rounded-xl bg-rose-400 px-5 py-3 font-bold text-slate-950 transition hover:bg-rose-300">Uitloggen</button></form>
  </div>
</section>
{% endblock %}
