{% extends "base.html" %}
{% block title %}E-mail verstuurd · Maintainers{% endblock %}
{% block content %}
<section class="mx-auto max-w-md px-6 py-20">
  <div class="rounded-2xl border border-slate-800 bg-slate-900 p-8 text-center shadow-2xl shadow-black/20">
    <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-mint/10 text-2xl text-mint" aria-hidden="true">✓</div>
    <h1 class="mt-5 text-3xl font-black">Controleer je e-mail</h1>
    <p class="mt-3 text-sm leading-6 text-slate-400">Als er een account met dit e-mailadres bestaat, ontvang je zo een link om je wachtwoord opnieuw in te stellen.</p>
    <a href="{% url 'account_login' %}" class="btn-primary mt-8 w-full">Terug naar inloggen</a>
  </div>
</section>
{% endblock %}
